/* v10.3: own-hosting publish via GitHub (private token on her phone). v10.2: photo from buy link (best effort). v10.1: YouTube cover auto. v10: mockup layout, product grid, blocks. v9: whole-photo banner, dimming only when text is shown. v8: top-section controls, product photos, Malayalam fonts. v7: banner size options (width, no cropping). v4: banner photo/GIF with zoom, text colour and heading style, editable social tabs. Layout: phone-width shop feed. Hero (banner photo or gradient), category chips, one card per reel with its products. Owner-only edit mode adds sheets and a save bar. */
:root {
  --bg: #fbf5f9; --card: #ffffff; --ink: #2a1233; --muted: #7a6483; --line: #ecdde8;
  --plum: #8e1b6b; --plum-ink: #ffffff; --hero-a: #5a0f45; --hero-b: #b4237f;
  --sun: #f4b81c; --sun-ink: #3a2600; --danger: #b3261e;
  --font-display: "Bricolage Grotesque", "Noto Sans Malayalam", system-ui, sans-serif;
  --font-body: "DM Sans", "Noto Sans Malayalam", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #170c1d; --card: #241130; --ink: #f7ebf4; --muted: #b9a3c2; --line: #3a2147;
    --plum: #ff6fb5; --plum-ink: #2a0a1f; --danger: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #170c1d; --card: #241130; --ink: #f7ebf4; --muted: #b9a3c2; --line: #3a2147;
  --plum: #ff6fb5; --plum-ink: #2a0a1f; --danger: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
body.is-editing { padding-bottom: 110px; }
.col { max-width: 460px; margin: 0 auto; }
a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--plum); outline-offset: 2px; }

.hero {
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  padding-block: 32px 40px;
  background: linear-gradient(160deg, var(--hero-a), var(--hero-b));
  color: #fff; border-radius: 0 0 28px 28px; position: relative; overflow: hidden;
}
.hero .col { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.avatar {
  width: 96px; height: 96px; border-radius: 50%; object-fit: cover; background: #fff; display: grid; place-items: center;
  box-shadow: 0 0 0 4px var(--sun), 0 8px 24px rgba(0,0,0,.25);
}
.avatar.letter { background: var(--sun); color: var(--sun-ink); font: 800 40px/1 var(--font-display); }
.hero h1 { margin: 8px 0 0; font: 800 32px/1.05 var(--font-display); letter-spacing: -0.02em; overflow-wrap: anywhere; }
.hero .handle { margin: 0; opacity: .88; font-size: 14px; }
.hero .lead { margin: 10px 0 0; font: 600 20px/1.25 var(--font-display); max-width: 20ch; text-wrap: balance; }
.hero .ml { margin: 0; opacity: .92; font-size: 14px; }
.steps { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.steps span { border: 1px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; }
.socials { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
.pill {
  display: inline-flex; align-items: center; min-height: 40px; padding: 0 18px; border-radius: 999px; border: 0;
  background: #fff; color: #3a0a2e; font-weight: 700; font-size: 14px; text-decoration: none; cursor: pointer;
}
.pill:hover { background: var(--sun); }
.pill.dash { background: transparent; color: #fff; border: 1.5px dashed rgba(255,255,255,.8); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 20px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 38px; padding: 0 16px; border-radius: 999px; background: var(--card);
  border: 1px solid var(--line); color: var(--ink); font: 500 14px var(--font-body); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--plum); border-color: var(--plum); color: var(--plum-ink); font-weight: 700; }
.chip.edit { border: 1.5px dashed var(--plum); color: var(--plum); background: transparent; font-weight: 700; }

.feed { display: flex; flex-direction: column; gap: 16px; margin-top: 12px; }
.reel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.reel-top { display: flex; gap: 14px; padding: 14px; align-items: flex-start; }
.cover {
  position: relative; flex: none; width: 92px; aspect-ratio: 9 / 13; border-radius: 12px; overflow: hidden;
  background: var(--line) center / cover no-repeat;
}
.cover::after {
  content: ""; position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; border-radius: 50%;
  background: rgba(0,0,0,.55) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M9 7l9 5-9 5z' fill='white'/></svg>") center / 16px no-repeat;
}
.info { min-width: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
.badge { align-self: flex-start; background: var(--sun); color: var(--sun-ink); font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 999px; }
.reel h2 { margin: 0; font: 800 19px/1.2 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; overflow-wrap: anywhere; }
.reel .sub { margin: 0; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.items { border-top: 1px solid var(--line); display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.item + .item { border-top: 1px solid var(--line); }
.thumb { flex: none; width: 52px; height: 52px; border-radius: 10px; background: var(--line) center / cover no-repeat; }
.item .txt { flex: 1; min-width: 0; }
.item .nm { margin: 0; font-weight: 700; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.item .pr { margin: 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.buy {
  flex: none; display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 16px;
  border-radius: 999px; background: var(--plum); color: var(--plum-ink); font-weight: 700; font-size: 14px; text-decoration: none; white-space: nowrap;
}
.buy:hover { filter: brightness(1.1); }
.buy[aria-disabled="true"] { background: transparent; color: var(--muted); border: 1.5px dashed var(--line); filter: none; }
.empty { text-align: center; color: var(--muted); padding: 24px 0; }

.stack { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; }
.note { background: var(--sun); color: var(--sun-ink); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.collab { border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.note h3, .collab h3 { margin: 0; font: 800 18px/1.2 var(--font-display); }
.note p, .collab p { margin: 0; font-size: 14px; }
.collab p { color: var(--muted); }
.copyrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copyrow code { font: 700 15px var(--font-body); padding: 8px 12px; border-radius: 8px; background: rgba(127,127,127,.14); overflow-wrap: anywhere; user-select: all; min-width: 0; }
.copybtn { min-height: 38px; padding: 0 14px; border-radius: 8px; border: 1.5px solid currentColor; background: transparent; color: var(--plum); font: 700 13px var(--font-body); cursor: pointer; }
.note .copybtn { color: inherit; }
.disclosure { margin: 0; text-align: center; color: var(--muted); font-size: 12.5px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; max-width: 90vw; text-align: center;
}

.hbwrap { width: 100%; border-radius: 16px; overflow: hidden; background: rgba(0,0,0,.2); margin-bottom: 6px; }
.hbanner { display: block; width: 100%; height: 100%; max-width: none; object-fit: cover; }
.hero.fit { display: grid; padding: 0; }
.hero.fit > * { grid-area: 1 / 1; }
.hfitw { position: relative; width: 100%; max-width: 760px; justify-self: center; align-self: start; }
.hfit { display: block; width: 100%; height: auto; max-width: none; }
.hero.fit .col { z-index: 1; width: 100%; max-width: 460px; justify-self: center; align-self: center; padding: 28px max(16px, env(safe-area-inset-left, 0px)); }
.hbg, .hdim { position: absolute; inset: 0; }
.hbg { background-size: cover; background-repeat: no-repeat; }
.pill img { width: 20px; height: 20px; margin-right: 8px; object-fit: contain; }
.pv.wide { position: relative; overflow: hidden; width: 100%; height: 120px; color: #fff; font: 800 28px var(--font-display); background: linear-gradient(160deg, var(--hero-a), var(--hero-b)); }
.pv.wide .pvt { position: relative; }
.fld input[type="range"] { padding: 0; border: 0; background: transparent; accent-color: var(--plum); }
.sw input[type="color"] { width: 44px; height: 44px; border: 0; padding: 0; background: none; border-radius: 50%; cursor: pointer; }
/* edit mode */
.addreel {
  min-height: 56px; border-radius: 16px; border: 2px dashed var(--plum); background: transparent; color: var(--plum);
  font: 800 16px var(--font-display); cursor: pointer;
}
.rtools { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); background: rgba(127,127,127,.07); }
.mini {
  min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  font: 700 13px var(--font-body); cursor: pointer;
}
.mini.pri { background: var(--plum); border-color: var(--plum); color: var(--plum-ink); }
.mini.del { color: var(--danger); }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; gap: 10px; justify-content: center;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--card); border-top: 1px solid var(--line);
}
.bar .big { flex: 1; max-width: 220px; min-height: 46px; border-radius: 12px; border: 1.5px solid var(--plum); background: transparent; color: var(--plum); font: 800 15px var(--font-body); cursor: pointer; }
.bar .big.pri { background: var(--plum); color: var(--plum-ink); }
.bar .big[disabled] { opacity: .6; }
.fab {
  position: fixed; z-index: 40; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--ink); color: var(--bg);
  font: 700 14px var(--font-body); cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.3);
}
.ov { position: fixed; inset: 0; z-index: 50; background: rgba(10,4,14,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 520px; max-height: 92vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
  border-radius: 20px 20px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px);
}
.shead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 8px; }
.shead h3 { margin: 0; font: 800 20px/1.2 var(--font-display); }
.sbody { overflow-y: auto; padding: 8px 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.sfoot { display: flex; gap: 10px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.sfoot button { flex: 1; min-height: 46px; border-radius: 12px; border: 1.5px solid var(--plum); background: transparent; color: var(--plum); font: 800 15px var(--font-body); cursor: pointer; }
.sfoot button.pri { background: var(--plum); color: var(--plum-ink); }
.fld { display: flex; flex-direction: column; gap: 4px; }
.fl { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.fld input, .fld textarea, .fld select {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font: 400 16px var(--font-body);
}
.sec { margin: 6px 0 0; font: 800 15px var(--font-display); }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.imgctl { display: flex; gap: 12px; align-items: center; }
.pv {
  flex: none; width: 96px; height: 64px; border-radius: 10px; background: var(--line) center / cover no-repeat;
  display: grid; place-items: center; font-size: 12px; color: var(--muted); text-align: center;
}
.pv.round { width: 72px; height: 72px; border-radius: 50%; }
.pv.tall { width: 64px; height: 92px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 500 14px var(--font-body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--plum); border-color: var(--plum); color: var(--plum-ink); font-weight: 700; }
.sw { display: flex; gap: 10px; flex-wrap: wrap; }
.sw button { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--bg); box-shadow: 0 0 0 1.5px var(--line); cursor: pointer; }
.sw button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.prod { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.crow { display: flex; gap: 6px; align-items: center; }
.crow input { flex: 1; min-width: 0; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 400 16px var(--font-body); }
.crow .mini { min-width: 40px; padding: 0; }
/* v10: mockup layout. Page is a list of blocks (banner, social buttons, announcement bar, categories, product grid, cards). Each block can be hidden, moved, edited; announcement bars can be added. */
.blk { max-width: 460px; margin: 18px auto 0; }
.blk:first-child { margin-top: 16px; }
.blk.off { border: 1.5px dashed var(--line); border-radius: 14px; padding: 10px 12px; opacity: .85; }
.offlbl { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
.btools { margin-top: 8px; border: 1px dashed var(--line); border-radius: 12px; background: transparent; }
.btools .bname { flex: 1 0 100%; font-size: 12.5px; color: var(--muted); }
.socrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
.sp { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 10px; border-radius: 999px; border: 2px solid color-mix(in srgb, var(--plum) 30%, var(--card)); background: var(--card); color: var(--ink); font: 700 14px var(--font-body); text-decoration: none; min-width: 0; }
.sp img { width: 24px; height: 24px; object-fit: contain; flex: none; }
.sp i { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--plum); color: var(--plum-ink); display: grid; place-items: center; font: 800 12px var(--font-body); font-style: normal; }
.sp span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ann { display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 13px 14px; font-weight: 700; font-size: 15px; line-height: 1.35; text-decoration: none; background: color-mix(in srgb, var(--plum) 14%, var(--card)); color: var(--plum); }
.annic { font-size: 22px; line-height: 1; flex: none; }
.annt { min-width: 0; overflow-wrap: anywhere; }
.chead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.chead h2 { margin: 0; font: 800 19px/1.2 var(--font-display); }
.vall { min-height: 40px; padding: 0 4px; border: 0; background: transparent; color: var(--plum); font: 700 14px var(--font-body); cursor: pointer; }
.catsblk .chips { padding: 8px 0 4px; }
.chip { display: inline-flex; align-items: center; gap: 7px; }
.cico { width: 22px; height: 22px; object-fit: contain; border-radius: 50%; font-size: 17px; line-height: 22px; text-align: center; }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.pcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.pph { position: relative; aspect-ratio: 4 / 5; background: var(--line) center / cover no-repeat; }
.pph.ph { background: linear-gradient(160deg, var(--hero-a), var(--hero-b)); display: grid; place-items: center; color: rgba(255,255,255,.55); font: 800 48px var(--font-display); }
.pico { position: absolute; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: #2a1233; display: grid; place-items: center; cursor: pointer; text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.pico.heart { position: static; flex: none; width: 34px; height: 34px; background: transparent; box-shadow: none; color: var(--ink); }
.pnrow { display: flex; gap: 6px; align-items: flex-start; justify-content: space-between; }
.pico.reel { right: 8px; top: 8px; background: rgba(255,255,255,.55); color: #fff; backdrop-filter: blur(4px); width: 36px; height: 36px; }
.pico svg { display: block; }
.heart svg { fill: none; stroke: currentColor; stroke-width: 2; }
.heart[aria-pressed="true"] svg { fill: #e0245e; stroke: #e0245e; }
.pbody { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.pnm { margin: 0; flex: 1; min-width: 0; font: 700 14.5px/1.3 var(--font-body); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.psub { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.35; overflow-wrap: anywhere; }
.ppr { margin: 0; font: 800 15px var(--font-body); color: var(--plum); }
.pbuy { margin-top: auto; padding-top: 0; }
.pbuy > * { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; min-height: 42px; margin-top: 8px; border-radius: 12px; background: var(--plum); color: var(--plum-ink); font: 800 14px var(--font-body); text-decoration: none; }
.pbuy > [aria-disabled="true"] { background: transparent; color: var(--muted); border: 1.5px dashed var(--line); }
.ptools { display: flex; gap: 4px; padding: 6px; border-top: 1px solid var(--line); background: rgba(127,127,127,.07); }
.ptools .mini { flex: 1; min-width: 36px; padding: 0 4px; }
@media (prefers-reduced-motion: no-preference) {
  .reel { transition: transform .15s ease; }
